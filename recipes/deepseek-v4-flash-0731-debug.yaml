# Recipe: DeepSeek V4 Flash 0731 (DSML debug)
# Identical to deepseek-v4-flash-0731 except for request/response logging.
# Purpose: capture the raw model text that the DSML parser sees, alongside the
# parsed result, to debug tool-call parse failures (orphan invoke / closing tail).
#
# Serving config is deliberately byte-for-byte the same as the production recipe
# (same mods, same max_num_seqs, same speculative config) so the bug reproduces
# under identical conditions. The only delta is observability.

recipe_version: "1"
name: DeepSeek-V4-Flash-0731-Debug
description: DeepSeek-V4-Flash-0731 with raw+parsed output logging for DSML tool-call debugging

model: deepseek-ai/DeepSeek-V4-Flash-0731
container: vllm-node-b12x
container_name: vllm_deepseek_v4_flash_0731_debug

build_args:
  - --exp-b12x

cluster_only: true

# Keep in sync with deepseek-v4-flash-0731.yaml. Comment a mod out to get a
# baseline of the unpatched parser behaviour for comparison.
mods:
  - mods/instanttensor-hybrid-draft-loader
  - mods/fix-deepseek-v4-dsml-recovery
  - mods/fix-deepseek-v4-trailing-system-genprompt
#   - mods/drop-caches

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: auto
  block_size: 256
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 64
  num_speculative_tokens: 5

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOE_SKIP_PADDING: "0"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"
  # log_outputs() is logger.info, so INFO is enough for output logging.
  # Set to DEBUG to also log the rendered prompt (log_inputs is DEBUG-gated) --
  # useful for confirming residual DSML is contaminating the next turn's context.
  VLLM_LOGGING_LEVEL: "INFO"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X_MLA_SPARSE \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}}' \
      --enable-log-requests \
      --enable-log-outputs \
      --no-enable-log-deltas
